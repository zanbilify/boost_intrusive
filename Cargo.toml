[package]
name = "boost_intrusive"
description = "Boost C++ library boost_intrusive packaged using Zanbil"
version = "0.1.0"
edition = "2024"
links = "boost_intrusive"
license = "BSL-1.0"
repository = "https://github.com/zanbilify/boost_intrusive"

[package.metadata.zanbil]
make_dependencies_public = true

[dependencies]
boost_assert = { version = "0.1.0", path = "../boost_assert" }
boost_config = { version = "0.1.0", path = "../boost_config" }
boost_move = { version = "0.1.0", path = "../boost_move" }

[build-dependencies]
zanbil-boost-build = "0.1.0"
